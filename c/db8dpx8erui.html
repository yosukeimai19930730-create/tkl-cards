<body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#fff">
<p style="padding:24px;font-size:15px;color:#555">
  移動中です… <a href="https://lite.tiktok.com/t/ZS9hESWsVMPkv-mVUZg/">開かない場合はこちら</a>
</p>
<script>var _go=function(){location.replace("https://lite.tiktok.com/t/ZS9hESWsVMPkv-mVUZg/");};
try{
var _q=new URLSearchParams(location.search),
_u="https://kurashi-strategy.net/tkl-go/hit.php"+"?c=db8dpx8erui"+(_q.get("t")?"&t="+encodeURIComponent(_q.get("t")):"");
var _send=function(){if(navigator.sendBeacon){navigator.sendBeacon(_u);}else{(new Image()).src=_u;}};
var _ua=navigator.userAgent||"";
var _android=/Android/i.test(_ua), _ios=/iPhone|iPad|iPod/i.test(_ua);
/* TikTok Lite のディープリンク（spark_page=scan_code はQRスキャン/招待画面） */
var _app="aweme://roma_redirect/?spark_page=scan_code";
var _pkg="com.ss.android.ugc.tiktok.lite";
_send();
if(_android){
  /* intent:// でアプリを直接起動（インストール済みユーザー）。
     未インストールなら S.browser_fallback_url の lite.tiktok.com
     （attribution付き）へ自動フォールバック。WebViewでもOSが処理する。 */
  try{
    location.replace("intent://roma_redirect/?spark_page=scan_code#Intent;scheme=aweme;package="+_pkg+";S.browser_fallback_url="+encodeURIComponent("https://lite.tiktok.com/t/ZS9hESWsVMPkv-mVUZg/")+";end");
  }catch(e){_go();}
}else if(_ios){
  /* iOS: aweme:// を試し、アプリが起動しなければ（画面が残っていれば）Webへ。
     アプリが起動した場合はページが非表示になり visibilitychange で発火を止める。 */
  var _t=Date.now();
  location.href=_app;
  setTimeout(function(){
    if(document.visibilityState!=="hidden"&&Date.now()-_t<2000){_go();}
  },1200);
}else{
  _go();
}
}catch(e){_go();}</script>
